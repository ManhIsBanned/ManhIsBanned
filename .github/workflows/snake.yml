name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # Tự động chạy mỗi ngày 1 lần
  workflow_dispatch: # Cho phép bạn tự bấm chạy thủ công

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1 # Đã update lên v4
      
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.svg?palette=github-light
            
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4.1.0 # Đã update lên v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
